name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch/PR ref: a new push supersedes the in-flight run. Never on master, so every
# commit on a release branch keeps its own result instead of being cancelled by the next push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: build + test + coverage
    # Pinned, NOT ubuntu-latest. protobuf C++ gives no cross-version gencode/runtime guarantee
    # (https://protobuf.dev/support/cross-version-runtime-guarantee/) - the committed code in
    # api/ carries a #error poison pill unless the runtime is the matching version. Those stubs
    # are produced by ondewo-cpp-proto-compiler, which pins Debian trixie
    # (ARG PROTOBUF_VERSION=3.21.12 / ARG GRPC_VERSION=1.51.1); ubuntu-24.04 ships that same
    # protobuf. The "Verify the toolchain" step below turns a runner image that stops shipping
    # it into a one-line failure instead of a wall of #error output, but moving this runner
    # still means re-checking those two ARGs first.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # No submodules. ondewo-vtsi-api is a codegen INPUT and the generated stubs are committed,
      # ondewo-proto-compiler is only needed to rebuild the docker image - which this workflow
      # deliberately does not do, because compiling .proto files is a separate, slow concern.
      # Everything below builds and tests the code that is in this repository.
      - uses: actions/checkout@v4

      # Exactly the packages ondewo-proto-compiler/cpp/Dockerfile installs, plus GoogleTest and
      # gcovr for the test suite. libgrpc-dev is needed in addition to libgrpc++-dev because
      # only it ships gRPCConfig.cmake, which the generated package's find_dependency(gRPC
      # CONFIG) resolves.
      - name: Install the protobuf / gRPC C++ toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            protobuf-compiler libprotobuf-dev \
            protobuf-compiler-grpc libgrpc++-dev libgrpc-dev libabsl-dev \
            libgtest-dev gcovr

      # The committed gencode was emitted by protoc 3.21.12 and refuses to compile against a
      # runtime outside 3.21.x. Assert that here so a runner image bump fails with a sentence
      # rather than thousands of lines of preprocessor errors.
      - name: Verify the toolchain matches the committed gencode
        run: |
          cmake --version
          protoc --version
          dpkg-query -W -f='libprotobuf-dev ${Version}\n' libprotobuf-dev
          dpkg-query -W -f='libgrpc++-dev ${Version}\n' libgrpc++-dev
          runtime="$(protoc --version | awk '{print $2}')"
          case "$runtime" in
            3.21.*) echo "protobuf runtime $runtime matches the committed gencode" ;;
            *)
              echo "::error::protobuf runtime is $runtime but api/ was generated by protoc 3.21.12;"\
                   "C++ gencode and runtime must match - re-pin the runner or regenerate the stubs"
              exit 1
              ;;
          esac

      # Fails outright when api/ or public-api.h is absent or inconsistent. This is the step
      # that makes the rest of the workflow meaningful: none of it may be satisfiable by a
      # repository that ships no stubs.
      - name: Verify the committed stubs
        run: make check_stubs

      - name: Build the client library
        run: make build_library

      # Builds and runs the GoogleTest suite against the installed package, then fails if line
      # coverage of the hand-written sources under tests/ drops below 100 %. The generated
      # stubs are not in the metric - the archive is compiled without --coverage - but every
      # message, enum and service in them is exercised by the tests themselves.
      - name: Run the test suite and enforce the coverage floor
        run: make coverage

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.txt
          if-no-files-found: error
          retention-days: 14

      # The consumer's view: find_package() the installed CMake package from an unrelated
      # project, include the umbrella header and link the exported target.
      - name: Consume the installed CMake package
        run: make smoke_test

      # The packaging path, exercised on every push and needing no credentials at all.
      # build_package stages the install tree into dist/<library>-<version>-<platform>.tar.gz;
      # verify_package extracts that tarball into a throwaway tree and builds
      # tests/package-consume against it - find_package() resolved from the extracted archive
      # (and asserted to come from there), umbrella header included, exported ondewo:: target
      # linked with the whole archive forced in. publish_dry_run is `make publish` minus the
      # `gh release upload`, so what CI proves here is exactly what a release publishes.
      - name: Build and consume the release archive (publish dry-run)
        run: make publish_dry_run

      # The exact bytes a release would attach, downloadable from the run - which also makes an
      # accidental change in the archive's size or contents visible without cutting a release.
      # Deliberately not `if: always()` like the coverage report above: when the dry-run fails
      # there is no archive, and an upload step that then fails on if-no-files-found would only
      # bury the real error under a second one.
      - name: Upload the release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-archive
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  lint:
    name: pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Only the pre-commit-stage hooks run here; giticket and conventional-pre-commit are
      # commit-msg hooks and are not exercised by --all-files.
      - name: Run the pre-commit hooks
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure
