name: release

# C++ has no package registry, so "publishing" this client means attaching a versioned archive of
# the CMake install tree - static library, public headers and package-config files - to the GitHub
# release. This workflow is the ONLY uploader: `make release` pushes the tag (which starts this
# run), creates the GitHub release with the notes and then `make release_verify` waits for the
# asset this run attaches. A release cut from any machine therefore carries the same asset, built
# on the pinned runner below. (The local release used to upload too, both with --clobber; archives
# are not byte-reproducible, so two interleaved uploads could leave a tarball and a .sha256 from
# different builders.)
#
# The trigger is the bare MAJOR.MINOR.PATCH tag `make create_release_tag` pushes. Nothing else
# starts a release: no branch push, no manual dispatch, no pre-release suffix.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

# contents: write covers the release-asset upload. The upload itself authenticates with the
# ONDEWO release PAT below rather than with the job's built-in token, so the asset is owned by the
# same identity that creates releases from a developer machine - the fleet's other clients publish
# to PyPI/npm with that identity too.
permissions:
  contents: write

# Never cancel a release in flight: a half-uploaded asset set is worse than a slow run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: build, verify and attach the release archive
    # Pinned for the same reason as ci.yml: protobuf C++ gives no cross-version gencode/runtime
    # guarantee, and the committed stubs in api/ were produced against the protobuf that
    # ubuntu-24.04 ships. See the long comment in ci.yml before moving this.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # FIRST, before a single package is installed. A missing credential has to abort the run
      # with one sentence - not after forty minutes of compiling, and never by "succeeding" with
      # nothing uploaded. The value is only ever tested for emptiness, never printed.
      - name: Verify the release credential is configured
        env:
          ONDEWO_GH_TOKEN: ${{ secrets.ONDEWO_GH_TOKEN }}
        run: |
          if [ -z "${ONDEWO_GH_TOKEN}" ]; then
            echo "::error title=Missing release credential::The repository secret ONDEWO_GH_TOKEN is not configured, so the release archive cannot be attached to the GitHub release. Add a GitHub personal access token with 'contents: write' on ondewo/ondewo-vtsi-client-cpp under Settings -> Secrets and variables -> Actions. It is the same token as GITHUB_GH_TOKEN in the devops-accounts file account_github.env; the secret cannot be called GITHUB_GH_TOKEN because GitHub reserves every secret name starting with GITHUB_."
            exit 1
          fi
          echo "ONDEWO_GH_TOKEN is configured"

      # No submodules: the stubs are committed, and nothing here regenerates them.
      # actions/checkout starts with a bare `git init`, and git then prints a multi-line
      # "Using 'master' as the name for the initial branch" hint into every job log. Naming the
      # default up front silences it; master is this repository's default branch anyway.
      - name: Name git's default branch
        run: git config --global init.defaultBranch master

      - uses: actions/checkout@v7

      # The archive is named after ONDEWO_VTSI_VERSION, not after the tag, so a tag that disagrees
      # with the Makefile would publish an asset under the wrong version. Catch that here instead
      # of after the upload.
      - name: Check the tag matches the version in the Makefile
        run: |
          makefile_version="$(sed -n 's/^ONDEWO_VTSI_VERSION=//p' Makefile)"
          if [ "${GITHUB_REF_NAME}" != "${makefile_version}" ]; then
            echo "::error title=Version drift::Tag ${GITHUB_REF_NAME} does not match ONDEWO_VTSI_VERSION=${makefile_version} in the Makefile; the release archive is named after the Makefile version, so it would be published under the wrong version."
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches ONDEWO_VTSI_VERSION"

      # Exactly the packages ci.yml installs, minus the test-only ones: this job builds and
      # packages the library, the branch CI is what gates the code.
      - name: Install the protobuf / gRPC C++ toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            protobuf-compiler libprotobuf-dev \
            protobuf-compiler-grpc libgrpc++-dev libgrpc-dev libabsl-dev

      - name: Verify the toolchain matches the committed gencode
        run: |
          runtime="$(protoc --version | awk '{print $2}')"
          case "$runtime" in
            3.21.*) echo "protobuf runtime $runtime matches the committed gencode" ;;
            *)
              echo "::error::protobuf runtime is $runtime but api/ was generated by protoc 3.21.12;"\
                   "C++ gencode and runtime must match - re-pin the runner or regenerate the stubs"
              exit 1
              ;;
          esac

      - name: Verify the committed stubs
        run: make check_stubs

      - name: Build the client library
        run: make build_library

      # build_package stages the install tree and tars it; verify_package extracts that tarball
      # into a throwaway tree and builds tests/package-consume against it - find_package() on the
      # extracted archive, umbrella header, exported ondewo:: target, whole archive linked in. An
      # archive that cannot be consumed never reaches the release.
      - name: Build and verify the release archive
        run: make publish_dry_run

      # POLL-THEN-PROCEED. `make release` pushes the tag - which is what started this run - and
      # creates the GitHub release a few seconds later, so the release is normally NOT there yet
      # when this job gets here. Waiting for it is the whole point; the two ways to get that
      # wrong are both guarded against below.
      #
      #  1. It must never degrade into a skip. "Release not there" is not "nothing to do": the
      #     next step is the upload, and a tag pushed without any release ever being created has
      #     to end the run loudly rather than quietly publish nothing. Hence the `exit 1` after
      #     the loop, not a `continue-on-error`.
      #  2. It must not swallow every gh failure into the retry. An expired token, a rate limit
      #     or a network error looks exactly like a missing release to a bare
      #     `gh release view ... >/dev/null 2>&1`, and retrying it for five minutes before
      #     reporting "no GitHub release" points whoever reads the log at the wrong problem. So
      #     gh's stderr is captured (`2>&1 >/dev/null` - stderr to the capture FIRST, then stdout
      #     to /dev/null; the reverse order captures stdout instead) and only the literal
      #     "release not found" is retried. Anything else fails on the first attempt, quoting
      #     what gh actually said.
      #
      # 30 attempts x 10s = the 5 minutes the timeout message names; keep the three in step.
      - name: Wait for the GitHub release to exist
        env:
          GH_TOKEN: ${{ secrets.ONDEWO_GH_TOKEN }}
        run: |
          for attempt in $(seq 1 30); do
            if err="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" 2>&1 >/dev/null)"; then
              echo "release ${GITHUB_REF_NAME} exists"
              exit 0
            fi
            case "${err}" in
              *"release not found"*) ;;
              *)
                echo "::error title=Cannot query the release::gh failed to read release ${GITHUB_REF_NAME} on ${GITHUB_REPOSITORY}, and the failure is not a missing release, so waiting longer cannot help: ${err}"
                exit 1
                ;;
            esac
            echo "attempt ${attempt}/30: release ${GITHUB_REF_NAME} does not exist yet, retrying in 10s"
            sleep 10
          done
          echo "::error title=No GitHub release::Tag ${GITHUB_REF_NAME} has no GitHub release after 5 minutes, so there is nothing to attach the archive to. Create it with 'make push_to_gh' (or 'gh release create ${GITHUB_REF_NAME}') and re-run this workflow."
          exit 1

      # gh reads GH_TOKEN from the environment; no token is ever named on a command line or in
      # the log. --clobber in upload_package makes a re-run replace the asset instead of failing.
      - name: Attach the release archive to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.ONDEWO_GH_TOKEN }}
        run: make upload_package

      # The upload must not be able to end in "0 assets, exit 0". Read the release back exactly as
      # a consumer would: non-empty notes, the archive and its .sha256 attached, both downloaded,
      # and `sha256sum -c` passing. The same script `make release_verify` runs on the release host.
      - name: Verify the published release (notes, assets, sha256)
        env:
          GH_TOKEN: ${{ secrets.ONDEWO_GH_TOKEN }}
          VERIFY_ATTEMPTS: '3'
          VERIFY_INTERVAL_S: '10'
        run: |
          library="$(sed -n 's/^LIBRARY_NAME=//p' Makefile)"
          sh tools/verify_release_asset.sh "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}" "${library}"
