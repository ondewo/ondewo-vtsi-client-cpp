#############################################################################################
# pre-commit - language-agnostic hooks for ondewo-vtsi-client-cpp.                                      #
#                                                                                            #
# Almost nothing here is hand-written: api/ and public-api.h are generated by the             #
# ondewo-cpp-proto-compiler image and CMakeLists.txt / ondewo-client-config.cmake.in are the  #
# build files it ships; the only authored C++ is the test suite under tests/. A C++ formatter #
# (clang-format) or linter (clang-tidy) would therefore mostly rewrite generated code, so     #
# none is configured here - correctness of the generated code is gated by `make test` and the #
# CI workflow instead.                                                                        #
# see https://pre-commit.com/#intro for an introduction to pre-commit                         #
#############################################################################################

# Never touch generated or vendored code: api/ + public-api.h are protoc output, the two CMake
# files are shipped verbatim by the compiler image (rewriting them would make every regeneration
# show a spurious diff), build/include/lib are build output and the two submodules belong to
# their own repositories.
exclude: '^(api/|public-api\.h$|CMakeLists\.txt$|ondewo-client-config\.cmake\.in$|ondewo-vtsi-api/|ondewo-proto-compiler/)|(^|/)(build|include|lib|\.smoke-test)/'

fail_fast: false
# "fail_fast: false" means pre-commit continues to run hooks after the first failure

repos:

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.0
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [ --maxkb=1024 ]
      - id: check-json
      - id: check-yaml
      - id: check-xml
      - id: check-merge-conflict
      - id: check-symlinks
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: trailing-whitespace
      - id: end-of-file-fixer

  # THE ORDER OF THE NEXT TWO IS LOAD-BEARING. Both run at the commit-msg stage, pre-commit runs
  # commit-msg hooks in declaration order, and each one sees what the previous one left in the
  # message file. giticket REWRITES the subject to "[OND221-2830] feat: ..." and
  # conventional-pre-commit VALIDATES it - so with giticket first the validator is handed a
  # subject that starts with the ticket and rejects it, and every commit on a ticket branch
  # fails. Measured both ways in a throwaway repo, on a branch named feature/OND221-2830-x,
  # committing "feat: add a thing":
  #   giticket -> conventional : giticket Passed, Conventional Commit FAILED
  #                              ("[Bad commit message] >> [OND221-2830] feat: add a thing"),
  #                              commit refused, HEAD unchanged
  #   conventional -> giticket : both Passed, commit lands as "[OND221-2830] feat: add a thing"
  # Validating first keeps the check at full strength rather than weakening it: a subject that is
  # not Conventional Commits is still rejected, and on a branch carrying no ticket giticket is a
  # no-op either way (both measured).
  # strip-ticket-prefix MUST stay first of the three commit-msg hooks. It removes a
  # `[OND221-2830] ` that a PREVIOUS run added, so conventional-pre-commit judges the
  # developer's own subject on an amend/reword instead of the decorated one, and giticket
  # applies the ticket exactly once. Without it `git commit --amend` on a ticket branch is
  # rejected, and giticket's own idempotency guard never fires (its branch regex demands a
  # `-` or `_` after the ticket; the `]` of an existing prefix is neither).
  - repo: local
    hooks:
      - id: strip-ticket-prefix
        name: strip a previously applied [TICKET] prefix
        entry: .hooks/strip-ticket-prefix.py
        language: python
        stages: [ commit-msg ]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [ commit-msg ]

  - repo: https://github.com/milin/giticket
    rev: '1.92'
    hooks:
      - id: giticket
        args: [ '--regex=(?:(?:feature|bugfix|support|hotfix)/)?(OND[0-9]{3}-[0-9]{1,5})[_-][\w-]+',
                '--format=[{ticket}] {commit_msg}',
                '--mode=regex_match' ]
